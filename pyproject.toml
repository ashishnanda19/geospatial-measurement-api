[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "FastAPI service that measures features in uploaded Shapefile (zip) and KML files."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
